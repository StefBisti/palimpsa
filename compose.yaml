services:
  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?set POSTGRES_USER in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:?set POSTGRES_DB in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    volumes:
      - pg_data:/var/lib/postgresql
    networks:
      - backend
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          pids: 128
          cpus: "0.5"
          memory: 256M

  migrate:
    image: ghcr.io/stefbisti/palimpsa-migrate:${IMAGE_TAG:-dev}
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    networks:
      - backend
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          pids: 64
          cpus: "0.5"
          memory: 64M

  collab:
    image: ghcr.io/stefbisti/palimpsa-collab:${IMAGE_TAG:-dev}
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - PORT=1234
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:1234').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    networks:
      - edge
      - backend
    stop_grace_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          pids: 128
          cpus: "0.5"
          memory: 256M

  api:
    image: ghcr.io/stefbisti/palimpsa-api:${IMAGE_TAG:-dev}
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    networks:
      - edge
      - backend
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          pids: 128
          cpus: "0.5"
          memory: 256M

volumes:
  pg_data:

networks:
  edge:
  backend:
    internal: true
