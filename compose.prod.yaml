services:
  db:
    restart: unless-stopped
    deploy:
      resources:
        limits: { pids: 128, cpus: "0.5", memory: 256M }
  migrate:
    deploy:
      resources:
        limits: { pids: 64, cpus: "0.5", memory: 64M }
  api:
    restart: unless-stopped
    environment:
      - COOKIE_SECURE=true
    deploy:
        resources:
          limits: { pids: 128, cpus: "0.5", memory: 256M }
  collab:
    restart: unless-stopped
    deploy:
        resources:
          limits: { pids: 128, cpus: "0.5", memory: 256M }
  web:
    restart: unless-stopped
    deploy:
      resources:
        limits: {pids: 64, cpus: "0.25", memory: 64M }

  proxy:
    restart: unless-stopped
    deploy:
      resources:
        limits: { pids: 64, cpus: "0.25", memory: 64M }

