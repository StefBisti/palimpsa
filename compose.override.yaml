services:
  migrate:
    build:
      context: ./db
  collab:
    build:
      context: ./collab
    ports:
      - 127.0.0.1:1234:1234
  api:
    build:
      context: ./api
      target: dev
    ports:
      - 127.0.0.1:3000:3000
    read_only: false
    develop:
      watch:
        - path: ./api/src
          action: sync
          target: /app/src
        - path: ./api/package-lock.json
          action: rebuild
